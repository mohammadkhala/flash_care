name: nabdh_therapist
description: "نبض - تطبيق الأخصائي"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # Navigation
  go_router: ^14.2.7

  # Network
  dio: ^5.7.0
  retrofit: ^4.4.1

  # Local Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3
  hive_flutter: ^1.1.0

  # UI
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  lottie: ^3.1.3
  fl_chart: ^0.69.0
  table_calendar: ^3.1.2
  image_picker: ^1.1.2
  file_picker: ^8.1.2
  photo_view: ^0.15.0
  video_player: ^2.9.2
  chewie: ^1.8.5

  # Messaging & Real-time
  socket_io_client: ^3.0.2
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^18.0.1

  # Calls
  jitsi_meet_flutter_sdk: ^10.1.0

  # Fonts
  google_fonts: ^6.2.1

  # Utils
  intl: ^0.20.2
  url_launcher: ^6.3.1
  permission_handler: ^11.3.1
  image_cropper: ^8.0.2
  flutter_rating_bar: ^4.0.1
  timeago: ^3.7.0
  path_provider: ^2.1.4
  open_file: ^3.5.8
  uuid: ^4.5.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  retrofit_generator: ^8.2.1
  build_runner: ^2.4.12
  json_serializable: ^6.8.0
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/

