name: nabdh_patient
description: "نبض - تطبيق المريض"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Navigation
  go_router: ^14.2.7

  # Network
  dio: ^5.7.0

  # Local Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3

  # UI
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  table_calendar: ^3.1.2
  image_picker: ^1.1.2
  file_picker: ^8.1.2
  video_player: ^2.9.2
  chewie: ^1.8.5
  flutter_rating_bar: ^4.0.1
  jitsi_meet_flutter_sdk: ^10.1.0
  open_file: ^3.3.2
  fl_chart: ^0.69.0

  # Firebase & Notifications
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^18.0.1
  workmanager: ^0.7.0

  # Utils
  intl: ^0.19.0
  url_launcher: ^6.3.1
  permission_handler: ^11.3.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Medium.ttf
        - asset: assets/fonts/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
